steps:
# 1. Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/my-project-web-chat-91774/chatbot-app:$COMMIT_SHA', '.']

# 2. Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/my-project-web-chat-91774/chatbot-app:$COMMIT_SHA']

# 3. Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'chatbot-app' # Name of the Cloud Run service
  - '--image'
  - 'gcr.io/my-project-web-chat-91774/chatbot-app:$COMMIT_SHA'
  - '--region'
  - 'us-central1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated' # Allows public access, adjust if needed
  # Add environment variables needed by your app. For secrets like API keys,
  # it's highly recommended to use Google Secret Manager and reference them here:
  # Example using Secret Manager (replace with your actual secret names and versions):
  # - '--set-secrets=MY_API=huggingface-api-key:latest'
  # Example setting non-sensitive env vars directly:
  # - '--set-env-vars=SOME_VARIABLE=some_value'

# This specifies the image produced by the build, which can be used by subsequent steps
images:
- 'gcr.io/my-project-web-chat-91774/chatbot-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

